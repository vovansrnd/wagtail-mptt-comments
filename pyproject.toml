[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wagtail-mptt-comments"
version = "0.2.9"
description = "Nested MPTT comments with spam protection and AJAX admin moderation for Wagtail CMS."
readme = "README.md"
authors = [{ name = "Vladimir Tarasov" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 8",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "wagtail>=6.0",
    "django-mptt>=0.16.0",
    "django-prose-editor>=0.26",
    "nh3>=0.2.14",
]

[project.urls]
Home = "https://github.com/vovansrnd/wagtail-mptt-comments"
Source = "https://github.com/vovansrnd/wagtail-mptt-comments"
Issues = "https://github.com/vovansrnd/wagtail-mptt-comments/issues"
PyPI = "https://pypi.org/project/wagtail-mptt-comments/"
